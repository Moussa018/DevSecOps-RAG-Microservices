name: devsecops
on:
  push: { branches: [main, dev , feat/java-microservices] }
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: trufflesecurity/trufflehog@main
        with: { extra_args: --only-verified }

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (Java, JWT, secrets, Kubernetes, Dockerfile)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.97.0 semgrep --metrics=off \
            --config=p/java --config=p/jwt --config=p/secrets --config=p/kubernetes --config=p/dockerfile \
            --exclude=report --error --severity=ERROR .

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dependency-check/Dependency-Check_Action@1.1.0
        with: { project: rag-secure, path: ., format: HTML, args: "--failOnCVSS 9 --enableRetired --exclude **/report/**" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: dependency-check-report, path: reports }
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { scan-type: fs, scanners: "vuln,misconfig", severity: "CRITICAL,HIGH", ignore-unfixed: true, trivyignores: .trivyignore, skip-dirs: "report", exit-code: "1" }

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: "21", distribution: temurin, cache: maven }
      - name: Security tests of the four Java microservices (JUnit)
        run: mvn -B verify

  images:
    needs: [secrets, sast, sca, tests]
    runs-on: ubuntu-latest
    strategy:
      matrix: { service: [gateway, uaa-service, ingestion-service, rag-service] }
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ${{ matrix.service }}:ci -f services/${{ matrix.service }}/Dockerfile .
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "${{ matrix.service }}:ci", severity: CRITICAL, ignore-unfixed: true, exit-code: "1" }
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "${{ matrix.service }}:ci", format: cyclonedx, output: "sbom-${{ matrix.service }}.cdx.json" }
      - uses: actions/upload-artifact@v4
        with: { name: "sbom-${{ matrix.service }}", path: "sbom-${{ matrix.service }}.cdx.json" }
