name: devsecops
on:
  push: { branches: [main, dev] }
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"   # re-scan hebdomadaire : de nouvelles CVE apparaissent sans changement de code

permissions:
  contents: read

env:
  AWS_REGION: eu-west-3

jobs:
  # ---- 1. Secrets ----
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  # ---- 2. SAST : Semgrep + CodeQL + Bandit, resultats dans l'onglet Security de GitHub ----
  sast:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Semgrep
        run: |
          pip install semgrep bandit
          semgrep --config=p/python --config=p/java --config=p/secrets --config=p/kubernetes --config=p/terraform \
            --sarif --output=semgrep.sarif . || true
          semgrep --config=p/python --config=p/java --error --severity=ERROR .
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: semgrep.sarif, category: semgrep }
      - run: bandit -r services/ingestion-service services/rag-service -ll

  codeql:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    strategy:
      matrix: { language: [java, python] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.language == 'java'
        with: { distribution: temurin, java-version: 21, cache: maven }
      - uses: github/codeql-action/init@v3
        with: { languages: "${{ matrix.language }}" }
      - if: matrix.language == 'java'
        run: mvn -q -B -f services/gateway/pom.xml package -DskipTests
      - uses: github/codeql-action/analyze@v3

  # ---- 3. SCA + IaC (Terraform et Kubernetes) ----
  sca-and-iac:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install pip-audit
          pip-audit -r services/ingestion-service/requirements.txt
          pip-audit -r services/rag-service/requirements.txt
      - name: Trivy vulnerabilites des dependances
        uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: fs, scanners: vuln, severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
      - name: Trivy IaC (infra/ et k8s/) - SARIF
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          format: sarif
          output: trivy-iac.sarif
          severity: "HIGH,CRITICAL"
          trivyignores: .trivyignore
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy-iac.sarif, category: trivy-iac }
      - name: Trivy IaC - bloquant
        uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: config, severity: "CRITICAL,HIGH", trivyignores: .trivyignore, exit-code: "1" }

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate

  # ---- 4. Build, scan d'image, push ECR, signature ----
  build-scan-push:
    needs: [secrets-scan, sast, codeql, sca-and-iac, terraform-validate]
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write, id-token: write }
    strategy:
      matrix: { service: [gateway, ingestion-service, rag-service] }
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t local/${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}
      - name: Trivy image - SARIF
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy-image.sarif, category: "trivy-${{ matrix.service }}" }
      - name: Trivy image - bloque sur CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Credentials AWS (OIDC, sans cle)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ secrets.AWS_ROLE_ARN }}", aws-region: "${{ env.AWS_REGION }}" }
      - name: Login ECR
        if: github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push ECR
        if: github.ref == 'refs/heads/main'
        run: |
          IMG=${{ steps.ecr.outputs.registry }}/rag-secure/${{ matrix.service }}:${{ github.sha }}
          docker tag local/${{ matrix.service }}:${{ github.sha }} $IMG
          docker push $IMG
      - uses: sigstore/cosign-installer@v3
        if: github.ref == 'refs/heads/main'
      - name: Signature Cosign (sans cle)
        if: github.ref == 'refs/heads/main'
        run: |
          IMG=${{ steps.ecr.outputs.registry }}/rag-secure/${{ matrix.service }}
          DIGEST=$(aws ecr describe-images --repository-name rag-secure/${{ matrix.service }} --image-ids imageTag=${{ github.sha }} --query 'imageDetails[0].imageDigest' --output text)
          cosign sign --yes $IMG@$DIGEST

  # ---- 5. DAST : OWASP ZAP contre l'application demarree dans la CI ----
  dast:
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - name: Demarrer gateway (secret ephemere)
        run: |
          docker build -t gw services/gateway
          docker run -d --name gw -p 8080:8080 -e JWT_SECRET=$(openssl rand -hex 32) gw
          for i in $(seq 1 30); do curl -sf localhost:8080/actuator/health && break || sleep 3; done
      - uses: zaproxy/action-baseline@v0.12.0
        with: { target: "http://localhost:8080", fail_action: false, allow_issue_writing: false }

  # ---- 6. Deploiement AWS : manuel et limite a main ----
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: [build-scan-push, dast]
    runs-on: ubuntu-latest
    environment: aws-demo      # protege l'environnement avec une approbation manuelle dans GitHub
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ secrets.AWS_ROLE_ARN }}", aws-region: "${{ env.AWS_REGION }}" }
      - name: Publier les manifestes sur S3
        run: |
          aws s3 sync k8s s3://${{ secrets.RELEASE_BUCKET }}/release/k8s --delete
          aws s3 cp scripts/deploy-on-node.sh s3://${{ secrets.RELEASE_BUCKET }}/release/deploy-on-node.sh
      - name: Deployer sur le noeud via SSM
        run: |
          CMD=$(aws ssm send-command --instance-ids ${{ secrets.INSTANCE_ID }} \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["aws s3 cp s3://${{ secrets.RELEASE_BUCKET }}/release/deploy-on-node.sh /opt/rag/deploy-on-node.sh --region '"$AWS_REGION"'","bash /opt/rag/deploy-on-node.sh ${{ github.sha }}"]' \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id $CMD --instance-id ${{ secrets.INSTANCE_ID }}
          aws ssm get-command-invocation --command-id $CMD --instance-id ${{ secrets.INSTANCE_ID }} --query StandardOutputContent --output text
