name: devsecops
on:
  push: { branches: [main, dev] }
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: trufflesecurity/trufflehog@main
        with: { extra_args: --only-verified }

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install semgrep
          semgrep --config=p/java --config=p/python --config=p/jwt --config=p/secrets \
            --config=p/kubernetes --config=p/dockerfile --error --severity=ERROR .

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dependency-check/Dependency-Check_Action@1.1.0
        with: { project: rag-secure, path: ., format: HTML, args: "--failOnCVSS 9 --enableRetired" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: dependency-check-report, path: reports }
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { scan-type: fs, scanners: "vuln,misconfig", severity: "CRITICAL,HIGH", ignore-unfixed: true, trivyignores: .trivyignore, exit-code: "1" }

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r tests/requirements.txt && pytest tests -q

  images:
    needs: [secrets, sast, sca, tests]
    runs-on: ubuntu-latest
    strategy:
      matrix: { service: [gateway, uaa-service, audit-service, ingestion-service, rag-service] }
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ${{ matrix.service }}:ci services/${{ matrix.service }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "${{ matrix.service }}:ci", severity: CRITICAL, ignore-unfixed: true, exit-code: "1" }

  dast:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Demarrer le gateway
        run: |
          mkdir -p jwt
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out k.pem
          openssl pkey -in k.pem -pubout -out jwt/public.pem
          docker build -t gw services/gateway
          docker run -d --name gw -p 8080:8080 -v "$PWD/jwt:/jwt:ro" -e CLIENT_SECRET=$(openssl rand -hex 16) gw
          for i in $(seq 1 30); do curl -sf localhost:8080/actuator/health && break || sleep 3; done
      - uses: zaproxy/action-baseline@v0.15.0
        with: { target: "http://localhost:8080", fail_action: false, allow_issue_writing: false }
