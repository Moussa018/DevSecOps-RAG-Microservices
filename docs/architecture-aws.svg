<circle cx="212" cy="833" r="6" fill="#232F3E"/>
<text x="212" y="836" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="226" y="837" font-size="10.5" font-weight="normal" fill="#232F3E" text-anchor="start">Client sends HTTPS + JWT. The ALB, open to your IP only, forwards to Traefik on the core node.</text>
<circle cx="212" cy="846" r="6" fill="#232F3E"/>
<text x="212" y="849" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="226" y="850" font-size="10.5" font-weight="normal" fill="#232F3E" text-anchor="start">Traefik re-encrypts to the gateway over TLS. The gateway validates the JWT and the roles.</text>
<circle cx="212" cy="859" r="6" fill="#232F3E"/>
<text x="212" y="862" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="226" y="863" font-size="10.5" font-weight="normal" fill="#232F3E" text-anchor="start">The gateway calls ingestion-service and rag-service over mutual TLS, each on its own node and subnet.</text>
<circle cx="212" cy="872" r="6" fill="#232F3E"/>
<text x="212" y="875" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="226" y="876" font-size="10.5" font-weight="normal" fill="#232F3E" text-anchor="start">Both services reach qdrant over mutual TLS, back in the core subnet. Ingest and query never talk to each other.</text>
<circle cx="212" cy="885" r="6" fill="#232F3E"/>
<text x="212" y="888" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="226" y="889" font-size="10.5" font-weight="normal" fill="#232F3E" text-anchor="start">Only rag-service goes out, through the NAT gateway, to the Anthropic API. Embeddings are computed inside the services.</text>
