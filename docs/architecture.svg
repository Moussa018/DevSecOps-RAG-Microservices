<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker>
    <marker id="j" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b45309"/></marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <rect x="150" y="50" width="740" height="360" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="162" y="70" fill="#475569" font-weight="600">Kubernetes (k3s) · namespace "rag" · Pod Security restricted · NetworkPolicy default-deny · mutual TLS on every hop</text>

  <rect x="10" y="190" width="110" height="50" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="65" y="212" text-anchor="middle" font-weight="600">Client</text><text x="65" y="230" text-anchor="middle" font-size="11">user JWT (RS256)</text>

  <rect x="165" y="190" width="100" height="50" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="215" y="220" text-anchor="middle" font-weight="600">Traefik</text>

  <rect x="300" y="170" width="130" height="90" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="365" y="200" text-anchor="middle" font-weight="600">gateway</text>
  <text x="365" y="218" text-anchor="middle" font-size="11">Java · verifies user JWT</text>
  <text x="365" y="234" text-anchor="middle" font-size="11">roles → exchange token</text>

  <rect x="300" y="300" width="130" height="80" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="365" y="330" text-anchor="middle" font-weight="600">uaa-service</text>
  <text x="365" y="348" text-anchor="middle" font-size="11">signs JWT (private key)</text>
  <text x="365" y="364" text-anchor="middle" font-size="11">login · token · exchange</text>

  <rect x="500" y="90" width="150" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="575" y="118" text-anchor="middle" font-weight="600">ingestion-service</text>
  <text x="575" y="136" text-anchor="middle" font-size="11">mask · chunk · embed · ACL</text>

  <rect x="500" y="190" width="150" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="575" y="218" text-anchor="middle" font-weight="600">rag-service</text>
  <text x="575" y="236" text-anchor="middle" font-size="11">injection guard · ACL search</text>

  <rect x="500" y="300" width="150" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="575" y="328" text-anchor="middle" font-weight="600">audit-service</text>
  <text x="575" y="346" text-anchor="middle" font-size="11">security events</text>

  <rect x="740" y="140" width="130" height="70" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="805" y="170" text-anchor="middle" font-weight="600">qdrant</text>
  <text x="805" y="188" text-anchor="middle" font-size="11">vectors · mTLS</text>

  <rect x="740" y="250" width="130" height="50" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="805" y="272" text-anchor="middle" font-weight="600">Anthropic API</text>
  <text x="805" y="289" text-anchor="middle" font-size="11">443, rag-service only</text>

  <g stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M120 215 H165"/><path d="M265 215 H300"/>
    <path d="M430 195 L500 130"/><path d="M430 215 H500"/>
    <path d="M430 240 L500 320"/>
    <path d="M650 125 L740 165"/><path d="M650 220 L740 190"/><path d="M650 235 L740 270"/>
  </g>
  <g stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#j)">
    <path d="M365 260 V300"/>
    <path d="M500 345 H430"/>
  </g>
  <text x="372" y="285" fill="#b45309" font-size="11">exchange</text>
  <text x="440" y="338" fill="#b45309" font-size="11">service JWT</text>
  <text x="165" y="440" fill="#334155" font-size="12">Solid: request (carries an audience-scoped JWT, 2 min) · Dashed orange: token issuance · ingestion-service and rag-service also post audit events with a 5 min service JWT</text>
  <text x="165" y="458" fill="#64748b" font-size="11">No rule between ingestion-service and rag-service. Only rag-service may leave the cluster, to one destination.</text>
</svg>
