<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 400" role="img" aria-label="Le navigateur joint Traefik en HTTPS, Traefik joint la passerelle en TLS ; la passerelle transmet le JWT en mTLS à ingestion-service et rag-service ; uaa-service signe les jetons ; ingestion et rag ne se parlent pas ; seul rag sort vers l'API Groq.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1060" height="400" fill="#ffffff"/>
  <rect x="160" y="20" width="720" height="360" rx="12" fill="none" stroke="#94a3b8" stroke-dasharray="5 5"/>
  <text x="176" y="42" font-family="Consolas, monospace" font-size="11" fill="#475569">cluster k3s · namespace rag · NetworkPolicy default-deny · Pod Security restricted · mTLS sur chaque saut</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">
    <rect x="20" y="172" width="120" height="56" rx="8" fill="#ffffff" stroke="#1f2937"/>
    <text x="80" y="197" font-weight="600">Navigateur</text>
    <text x="80" y="214" font-size="11" fill="#475569">interface web</text>

    <rect x="180" y="172" width="120" height="56" rx="8" fill="#ffffff" stroke="#1f2937"/>
    <text x="240" y="197" font-weight="600">Traefik</text>
    <text x="240" y="214" font-size="11" fill="#475569">certificat web-tls</text>

    <rect x="340" y="162" width="150" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="415" y="188" font-weight="600">gateway</text>
    <text x="415" y="205" font-size="11">vérifie JWT + rôle</text>
    <text x="415" y="221" font-size="11">Java · Spring Security</text>

    <rect x="340" y="300" width="150" height="56" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="415" y="325" font-weight="600">uaa-service</text>
    <text x="415" y="342" font-size="11" fill="#475569">clé privée · signe RS256</text>

    <rect x="560" y="80" width="170" height="56" rx="8" fill="#ffffff" stroke="#1f2937"/>
    <text x="645" y="105" font-weight="600">ingestion-service</text>
    <text x="645" y="122" font-size="11" fill="#475569">ABAC · masque · indexe</text>

    <rect x="560" y="240" width="170" height="56" rx="8" fill="#ffffff" stroke="#1f2937"/>
    <text x="645" y="265" font-weight="600">rag-service</text>
    <text x="645" y="282" font-size="11" fill="#475569">filtre groupes · LLM</text>

    <rect x="770" y="160" width="110" height="56" rx="8" fill="#ffffff" stroke="#1f2937"/>
    <text x="825" y="185" font-weight="600">qdrant</text>
    <text x="825" y="202" font-size="11" fill="#475569">vecteurs · mTLS</text>

    <rect x="905" y="240" width="135" height="56" rx="8" fill="#ffffff" stroke="#1f2937" stroke-dasharray="4 3"/>
    <text x="972" y="265" font-weight="600">API Groq</text>
    <text x="972" y="282" font-size="11" fill="#475569">hors cluster</text>
  </g>

  <g fill="none" stroke="#1f2937" stroke-width="1.3">
    <line x1="140" y1="200" x2="178" y2="200" marker-end="url(#a)"/>
    <line x1="300" y1="200" x2="338" y2="200" marker-end="url(#a)"/>
    <line x1="730" y1="112" x2="768" y2="178" marker-end="url(#a)"/>
    <line x1="730" y1="262" x2="768" y2="200" marker-end="url(#a)"/>
    <line x1="730" y1="280" x2="903" y2="280" marker-end="url(#a)"/>
  </g>
  <line x1="415" y1="238" x2="415" y2="298" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <g fill="none" stroke="#2563eb" stroke-width="1.8">
    <polyline points="490,185 520,185 520,108 558,108" marker-end="url(#b)"/>
    <polyline points="490,215 520,215 520,268 558,268" marker-end="url(#b)"/>
  </g>
  <g font-family="Consolas, monospace" font-size="10.5" fill="#1f2937">
    <text x="159" y="190" text-anchor="middle">HTTPS</text>
    <text x="319" y="190" text-anchor="middle">TLS</text>
    <text x="423" y="274" fill="#b45309">login · mTLS</text>
    <text x="526" y="100" fill="#2563eb">JWT + mTLS</text>
    <text x="526" y="290" fill="#2563eb">JWT + mTLS</text>
    <text x="818" y="296">HTTPS 443</text>
    <text x="645" y="192" text-anchor="middle" fill="#c0392b">aucun flux ingestion ↔ rag</text>
  </g>
  <text x="20" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">Bleu : le jeton de l'utilisateur, transmis tel quel par la passerelle puis revérifié par chaque service. Orange : connexion et signature du jeton.</text>
</svg>
