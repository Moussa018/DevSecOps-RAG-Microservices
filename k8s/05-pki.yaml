---
# Certificate presented to the browser by Traefik (HTTPS entry point).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: web, namespace: rag }
spec:
  secretName: web-tls
  commonName: localhost
  duration: 2160h
  renewBefore: 360h
  dnsNames: [localhost]
  ipAddresses: [127.0.0.1]
  usages: [server auth]
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  issuerRef: { name: rag-ca, kind: Issuer, group: cert-manager.io }
