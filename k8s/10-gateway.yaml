apiVersion: v1
kind: ServiceAccount
metadata: { name: gateway, namespace: rag }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: rag }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      serviceAccountName: gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: gateway:latest      # en CI : reference par digest signe (cosign)
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: tls }   # TLS + certificat client obligatoire (application-tls.yml)
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: jwt-secret, key: secret } } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          # Sondes TCP : le kubelet ne peut pas presenter de certificat client
          readinessProbe: { tcpSocket: { port: 8080 }, initialDelaySeconds: 15 }
          livenessProbe: { tcpSocket: { port: 8080 }, initialDelaySeconds: 30 }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: tls, mountPath: /tls, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: tls, secret: { secretName: gateway-tls, defaultMode: 0440 } }
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: rag }
spec:
  selector: { app: gateway }
  ports: [{ name: https, port: 8080, targetPort: 8080 }]
