apiVersion: v1
kind: ServiceAccount
metadata: { name: ingestion-service, namespace: rag }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ingestion-service, namespace: rag }
spec:
  replicas: 1
  selector: { matchLabels: { app: ingestion-service } }
  template:
    metadata: { labels: { app: ingestion-service } }
    spec:
      serviceAccountName: ingestion-service
      securityContext: { runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: ingestion-service
          image: ingestion-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: rag-config } }]
          env:
            - { name: QDRANT_URL, value: "https://qdrant:6333" }
            - { name: CLIENT_ID, value: ingestion-service }
            - { name: CLIENT_SECRET, valueFrom: { secretKeyRef: { name: ingestion-service-client, key: secret } } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 200m, memory: 768Mi }, limits: { cpu: "1", memory: 1536Mi } }
          readinessProbe: { tcpSocket: { port: 8000 }, initialDelaySeconds: 15 }
          livenessProbe: { tcpSocket: { port: 8000 }, initialDelaySeconds: 30 }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: jwt-public, mountPath: /jwt, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: tls, secret: { secretName: ingestion-service-tls, defaultMode: 0440 } }
        - { name: jwt-public, configMap: { name: jwt-public } }
---
apiVersion: v1
kind: Service
metadata: { name: ingestion-service, namespace: rag }
spec: { selector: { app: ingestion-service }, ports: [{ name: https, port: 8000, targetPort: 8000 }] }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: rag-service, namespace: rag }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rag-service, namespace: rag }
spec:
  replicas: 1
  selector: { matchLabels: { app: rag-service } }
  template:
    metadata: { labels: { app: rag-service } }
    spec:
      serviceAccountName: rag-service
      securityContext: { runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: rag-service
          image: rag-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: rag-config } }]
          env:
            - { name: QDRANT_URL, value: "https://qdrant:6333" }
            - { name: CLIENT_ID, value: rag-service }
            - { name: CLIENT_SECRET, valueFrom: { secretKeyRef: { name: rag-service-client, key: secret } } }
            - { name: ANTHROPIC_API_KEY, valueFrom: { secretKeyRef: { name: anthropic-api-key, key: key, optional: true } } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 200m, memory: 768Mi }, limits: { cpu: "1", memory: 1536Mi } }
          readinessProbe: { tcpSocket: { port: 8000 }, initialDelaySeconds: 15 }
          livenessProbe: { tcpSocket: { port: 8000 }, initialDelaySeconds: 30 }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: jwt-public, mountPath: /jwt, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: tls, secret: { secretName: rag-service-tls, defaultMode: 0440 } }
        - { name: jwt-public, configMap: { name: jwt-public } }
---
apiVersion: v1
kind: Service
metadata: { name: rag-service, namespace: rag }
spec: { selector: { app: rag-service }, ports: [{ name: https, port: 8000, targetPort: 8000 }] }
