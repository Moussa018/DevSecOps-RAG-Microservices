# Entree unique : Traefik, l'ingress integre a k3s (port 80 du noeud serveur).
# Traefik re-chiffre vers le gateway en TLS et verifie son certificat avec la CA privee.
# Prerequis : le Secret "backend-ca" (cle tls.ca) est cree par les scripts de deploiement a partir de rag-ca.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata: { name: gateway-transport, namespace: rag }
spec:
  serverName: gateway.rag.svc          # nom verifie dans le certificat du gateway
  rootCAsSecrets: [backend-ca]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: limit-body, namespace: rag }
spec:
  buffering:
    maxRequestBodyBytes: 1048576       # 1 Mo
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: api, namespace: rag }
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/api`)
      kind: Rule
      middlewares: [{ name: limit-body }]
      services:
        - name: gateway
          port: 8080
          scheme: https
          serversTransport: gateway-transport
