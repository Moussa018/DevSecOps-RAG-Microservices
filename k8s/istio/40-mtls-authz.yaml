# mTLS obligatoire pour toutes les communications du namespace
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: { name: default, namespace: rag }
spec: { mtls: { mode: STRICT } }
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: deny-all, namespace: rag }
spec: {}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: gateway-from-ingress, namespace: rag }
spec:
  selector: { matchLabels: { app: gateway } }
  action: ALLOW
  rules:
    - from: [{ source: { principals: ["cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"] } }]
      to: [{ operation: { methods: ["POST"], paths: ["/api/documents", "/api/query"] } }]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: ingestion-from-gateway, namespace: rag }
spec:
  selector: { matchLabels: { app: ingestion-service } }
  action: ALLOW
  rules:
    - from: [{ source: { principals: ["cluster.local/ns/rag/sa/gateway"] } }]
      to: [{ operation: { methods: ["POST"], paths: ["/documents"] } }]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: rag-from-gateway, namespace: rag }
spec:
  selector: { matchLabels: { app: rag-service } }
  action: ALLOW
  rules:
    - from: [{ source: { principals: ["cluster.local/ns/rag/sa/gateway"] } }]
      to: [{ operation: { methods: ["POST"], paths: ["/query"] } }]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: qdrant-from-workers, namespace: rag }
spec:
  selector: { matchLabels: { app: qdrant } }
  action: ALLOW
  rules:
    - from: [{ source: { principals: ["cluster.local/ns/rag/sa/ingestion-service", "cluster.local/ns/rag/sa/rag-service"] } }]
