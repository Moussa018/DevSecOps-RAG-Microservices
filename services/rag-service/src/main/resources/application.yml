spring.application.name: rag-service
server:
  port: 8000
  server-header: ""
  max-http-request-header-size: 8KB
  error: { include-message: never, include-stacktrace: never }
jwt.public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:/jwt/public.pem}
qdrant.url: ${QDRANT_URL:https://qdrant:6333}
llm:
  backend: ${LLM_BACKEND:fake}
  model: ${LLM_MODEL_ID:qwen/qwen3.8-27b}
  api-key: ${GROQ_API_KEY:}
  max-tokens: ${MAX_OUTPUT_TOKENS:512}
  url: ${GROQ_URL:https://api.groq.com/openai/v1}
management:
  endpoints.web.exposure.include: health
